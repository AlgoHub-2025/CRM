version: '3.8'
services:
  pgsql:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: algohub_crm
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  pgsql-data:
  redis-data:
